# Nixpacks build override — skip `pip install .` (src-layout không build wheel được trong sandbox)
# Thay bằng pip install -r requirements.txt + chạy streamlit với PYTHONPATH=src

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
    "python -m venv /opt/venv",
    ". /opt/venv/bin/activate && pip install --upgrade pip",
    ". /opt/venv/bin/activate && pip install -r requirements.txt",
]

[start]
cmd = "PYTHONPATH=src /opt/venv/bin/python -m streamlit run webapp.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.enableCORS false --server.enableXsrfProtection false --browser.gatherUsageStats false"
