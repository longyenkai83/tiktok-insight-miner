[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-insight-miner"
version = "0.3.2"
description = "Quét comment TikTok, phân loại bằng Claude, xuất báo cáo insight markdown + content angle brief"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.50.0",
    "apify-client>=1.7.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0",
    "openpyxl>=3.1.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
]

[project.optional-dependencies]
# Backward compat — webapp deps đã move sang main vì server cần streamlit luôn
webapp = []

[project.scripts]
tim = "tiktok_insight_miner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiktok_insight_miner*"]
