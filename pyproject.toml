[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-insight-miner"
version = "0.3.2"
description = "Quét comment TikTok, phân loại bằng Claude, xuất báo cáo insight markdown + content angle brief"
requires-python = ">=3.11"
dependencies = [
    # Pinned exact — snapshot 2026-07-14. Đồng bộ với requirements.txt.
    "anthropic==0.96.0",
    "apify-client==2.5.0",
    "pydantic==2.13.3",
    "python-dotenv==1.2.2",
    "streamlit==1.57.0",
    "openpyxl==3.1.5",
    "google-api-python-client==2.198.0",
    "google-auth==2.56.0",
    "google-auth-oauthlib==1.4.0",
    "google-auth-httplib2==0.4.0",
]

[project.optional-dependencies]
# Backward compat — webapp deps đã move sang main vì server cần streamlit luôn
webapp = []
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[project.scripts]
tim = "tiktok_insight_miner.cli:main"

[tool.setuptools]
packages = ["tiktok_insight_miner"]
