# Railway deployment config
# Tham khảo: https://docs.railway.com/reference/config-as-code

[build]
# Dùng Dockerfile thay vì Nixpacks — kiểm soát hoàn toàn build process
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# KHÔNG dùng startCommand — để Dockerfile CMD chạy (shell form expand $PORT đúng)
# Nếu set startCommand ở đây, Railway exec form sẽ không expand $PORT → "Invalid integer" error

# Health check: Streamlit endpoint
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 60

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
