# Railway deployment config
# Tham khảo: https://docs.railway.com/reference/config-as-code

[build]
# Dùng Dockerfile thay vì Nixpacks — kiểm soát hoàn toàn build process
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# CMD đã định nghĩa trong Dockerfile — Railway không cần startCommand riêng
# Nhưng vẫn override để chắc chắn dùng $PORT của Railway
startCommand = "streamlit run webapp.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.enableCORS false --server.enableXsrfProtection false --browser.gatherUsageStats false"

# Health check: Streamlit endpoint
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 60

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
